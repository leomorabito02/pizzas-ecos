<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ECOS</title>
    <link rel="icon" type="image/jpeg" href="images/ecoslogo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <script>
        // Redirección inmediata si ya existe sesión iniciada
        (function() {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; authToken=`);
            if (parts.length === 2) {
                const token = parts.pop().split(';').shift();
                if (token) {
                    window.location.href = 'admin.html';
                }
            }
        })();
    </script>
    <script src="js/backend-config.js"></script>
    <script src="js/env.js"></script>
    <script src="js/api-service.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>ECOS Admin</h1>
            <p>Sistema de Gestión de Ventas</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Ingrese el usuario"
                    required 
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Ingrese la contraseña"
                        required 
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Mostrar contraseña">
                        <span class="material-symbols-outlined" id="togglePasswordIcon">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Iniciar Sesión
            </button>
        </form>

        <div class="form-link">
            <a href="index.html">← Volver al Formulario</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const togglePasswordIcon = document.getElementById('togglePasswordIcon');

        if (togglePasswordBtn) {
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePasswordIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Limpiar mensajes previos
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('Usuario y contraseña son requeridos');
                return;
            }

            if (password.length < 4) {
                showError('La contraseña debe tener al menos 4 caracteres');
                return;
            }

            // Deshabilitar botón y mostrar loading
            loginBtn.disabled = true;
            const originalText = loginBtn.textContent;
            loginBtn.innerHTML = '<span class="loading"></span>Autenticando...';

            try {
                const api = new APIService();
                const response = await fetch(`${api.baseURL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                // Try to parse as JSON, fallback to text
                let data;
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    if (!response.ok) {
                        showError(text || 'Error en la autenticación. Verifica tus credenciales.');
                        loginBtn.disabled = false;
                        loginBtn.textContent = originalText;
                        return;
                    }
                    // If successful but not JSON, redirect anyway
                    window.location.href = 'admin.html';
                    return;
                }

                if (!response.ok) {
                    showError(data.error || 'Error en la autenticación. Verifica tus credenciales.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = originalText;
                    return;
                }

                // Guardar token en sessionStorage (más seguro que localStorage)
                // sessionStorage se limpia automáticamente al cerrar la pestaña
                console.log('Login response:', data);
                console.log('data.data:', data.data);
                
                // Extraer datos del wrapped response: {status, data: {token, user}, message}
                // Nota: JSON serializa con minúsculas (token, user, id)
                const loginData = data.data;
                
                if (!loginData || !loginData.token || !loginData.user) {
                    console.error('Invalid login response structure:', loginData);
                    showError('Respuesta inválida del servidor. Por favor intenta nuevamente.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = originalText;
                    return;
                }
                
                const token = loginData.token;
                const userId = loginData.user.id;
                const usernameFromLogin = loginData.user.username;
                
                console.log('Token:', token, 'UserId:', userId);
                
                if (!token || !userId) {
                    showError('Error al procesar la respuesta del servidor.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = originalText;
                    return;
                }
                
                setCookie('authToken', token, 7);
                setCookie('userId', userId, 7);
                setCookie('username', usernameFromLogin, 7);

                showSuccess('¡Sesión iniciada correctamente!');
                
                // Redirigir al panel de admin después de 1 segundo
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión. Intenta nuevamente.');
                loginBtn.disabled = false;
                loginBtn.textContent = originalText;
            }
        });

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
        }

        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.classList.add('show');
        }

        // Pre-llenar con usuario de demo si existe
        window.addEventListener('load', () => {
            usernameInput.focus();
        });
    </script>
    
    <!-- Bottom Navbar -->
    <nav class="bottom-navbar">
        <a href="index.html" class="nav-btn">
            <span class="material-symbols-outlined">add_circle</span>
            <span>Nueva Venta</span>
        </a>
        <a href="estadisticas.html?tab=resumen" class="nav-btn">
            <span class="material-symbols-outlined">trending_up</span>
            <span>Resumen</span>
        </a>
        <a href="estadisticas.html?tab=vendedores" class="nav-btn">
            <span class="material-symbols-outlined">group</span>
            <span>Vendedores</span>
        </a>
        <a href="estadisticas.html?tab=ventas" class="nav-btn">
            <span class="material-symbols-outlined">list_alt</span>
            <span>Todas las Ventas</span>
        </a>
        <a href="login.html" class="nav-btn active">
            <span class="material-symbols-outlined">admin_panel_settings</span>
            <span>Admin</span>
        </a>
    </nav>
</body>
</html>
