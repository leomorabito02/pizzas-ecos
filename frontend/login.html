<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ECOS</title>
    <link rel="icon" type="image/jpeg" href="images/ecoslogo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/backend-config.js"></script>
    <script src="js/env.js"></script>
    <script src="js/api-service.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>ECOS Admin</h1>
            <p>Sistema de Gestión de Ventas</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Ingrese el usuario"
                    required 
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Ingrese la contraseña"
                    required 
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Iniciar Sesión
            </button>
        </form>

        <div class="form-link">
            <a href="index.html">← Volver al Formulario</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Limpiar mensajes previos
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showError('Usuario y contraseña son requeridos');
                return;
            }

            if (password.length < 4) {
                showError('La contraseña debe tener al menos 4 caracteres');
                return;
            }

            // Deshabilitar botón y mostrar loading
            loginBtn.disabled = true;
            const originalText = loginBtn.textContent;
            loginBtn.innerHTML = '<span class="loading"></span>Autenticando...';

            try {
                const api = new APIService();
                const response = await fetch(`${api.baseURL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                // Try to parse as JSON, fallback to text
                let data;
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    if (!response.ok) {
                        showError(text || 'Error en la autenticación. Verifica tus credenciales.');
                        loginBtn.disabled = false;
                        loginBtn.textContent = originalText;
                        return;
                    }
                    // If successful but not JSON, redirect anyway
                    window.location.href = 'admin.html';
                    return;
                }

                if (!response.ok) {
                    showError(data.error || 'Error en la autenticación. Verifica tus credenciales.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = originalText;
                    return;
                }

                // Guardar token en sessionStorage (más seguro que localStorage)
                // sessionStorage se limpia automáticamente al cerrar la pestaña
                console.log('Login response:', data);
                console.log('data.data:', data.data);
                
                // Extraer datos del wrapped response: {status, data: {token, user}, message}
                // Nota: JSON serializa con minúsculas (token, user, id)
                const loginData = data.data;
                
                if (!loginData || !loginData.token || !loginData.user) {
                    console.error('Invalid login response structure:', loginData);
                    showError('Respuesta inválida del servidor. Por favor intenta nuevamente.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = originalText;
                    return;
                }
                
                const token = loginData.token;
                const userId = loginData.user.id;
                const usernameFromLogin = loginData.user.username;
                
                console.log('Token:', token, 'UserId:', userId);
                
                if (!token || !userId) {
                    showError('Error al procesar la respuesta del servidor.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = originalText;
                    return;
                }
                
                sessionStorage.setItem('authToken', token);
                sessionStorage.setItem('userId', userId);
                sessionStorage.setItem('username', usernameFromLogin);

                showSuccess('¡Sesión iniciada correctamente!');
                
                // Redirigir al panel de admin después de 1 segundo
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión. Intenta nuevamente.');
                loginBtn.disabled = false;
                loginBtn.textContent = originalText;
            }
        });

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
        }

        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.classList.add('show');
        }

        // Pre-llenar con usuario de demo si existe
        window.addEventListener('load', () => {
            usernameInput.focus();
        });
    </script>
</body>
</html>
